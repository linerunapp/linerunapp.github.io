<script>(function(){var r=document.documentElement,b=document.querySelectorAll('.theme button');
function show(){var t=r.getAttribute('data-theme')||'auto';for(var i=0;i<b.length;i++)b[i].setAttribute('aria-pressed',b[i].getAttribute('data-set')===t)}
for(var i=0;i<b.length;i++)b[i].addEventListener('click',function(){var t=this.getAttribute('data-set');
if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
try{if(t==='auto')localStorage.removeItem('theme');else localStorage.setItem('theme',t)}catch(e){}show()});show()})();</script>
